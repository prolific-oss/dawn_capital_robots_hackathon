[project]
name = "dawn-capital-robots-hackathon"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.49.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
check-videos = "dawn_capital_robots_hackathon.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"
